# R CMD check with tests, failing on any NOTE as `scripts/check.sh --release` does.
# The Python comparison tests run against the pinned uv project in tests/python.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_SYSTEM_CLOCK_: false
      TESTTHAT_CPUS: 4

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: astral-sh/setup-uv@v6
        with:
          # h5py has no macOS wheels for newer Pythons, so match the local version
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: tests/python/uv.lock

      - name: Install the Python reference environment
        run: uv sync --project tests/python --locked

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"note"'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
