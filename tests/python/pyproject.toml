[project]
name = "anndata-claude-reference"
version = "0.0.0"
description = "Pinned Python reference environment for anndata.claude tests (scripts only, not a package)"
requires-python = ">=3.12"
dependencies = [
    "anndata==0.13.4",
    "pandas>=3",
    "h5py",
    "numpy",
    "scipy",
    # needed to import anndata.tests.helpers (used by compare.py)
    "pytest",
    "dask",
    "fast-array-utils>=1.2.3",
]

[tool.uv]
package = false
